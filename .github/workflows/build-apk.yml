name: Build EMQ APK

on:
  workflow_dispatch:        # Actions 탭에서 'Run workflow' 버튼으로 실행
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core
          command -v convert || command -v magick
          convert -version | head -1

      - name: Set app icon (앱 안의 아이콘과 동일한 이미지 사용)
        run: |
          set -e
          RES=android/app/src/main/res
          # 런처가 원형/둥근 사각형으로 잘라도 점이 잘리지 않도록 80%로 줄여 같은 배경색 위에 올림
          convert -size 512x512 xc:'#EEF0F2' \( assets/icon-only.png -resize 410x410 \) -gravity center -composite assets/launcher.png
          rm -rf $RES/mipmap-anydpi-v26 $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; sz=${d##*:}
            mkdir -p $RES/mipmap-$n
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert assets/launcher.png -resize ${sz}x${sz} $RES/mipmap-$n/$f.png
            done
          done
          ls $RES/mipmap-xxxhdpi

      - name: Notification icon
        continue-on-error: true
        run: |
          set -e
          RES=android/app/src/main/res
          mkdir -p $RES/drawable
          convert -size 96x96 xc:none -fill white -draw "roundrectangle 6,6 90,90 16,16" /tmp/base.png
          convert /tmp/base.png \( -size 96x96 xc:none -gravity center -pointsize 62 -font DejaVu-Sans-Bold -fill white -annotate 0 'E' \) -compose DstOut -composite $RES/drawable/ic_stat_icon.png

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EMQ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EMQ-apk
          path: apk/EMQ.apk
          retention-days: 30
