name: Build EMQ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Set app icon
        continue-on-error: true
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert assets/icon-only.png -resize ${s}x${s} $RES/mipmap-$d/$n.png
            done
          done

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EMQ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EMQ-apk
          path: apk/EMQ.apk
          retention-days: 30
